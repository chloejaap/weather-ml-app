name: Weather ML App CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test-ship:
    runs-on: ubuntu-latest

    steps:


# SET UP


      # Download Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install project packages
      - name: Install Flask and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


# TESTS


      # Smoke Test
      - name: Run Smoke Tests
        run: |
          python -m unittest tests/smoke_test.py

      # Unit Test
      - name: Run Unit Tests
        run: |
          python -m unittest tests/unit_test.py

      # Integration Test
      - name: Run Integration Tests
        run: |
          python -m unittest tests/integration_test.py


# DOCKER

# TODO (Group)
# Create DockerHub account/repository.
# Add GitHub Secrets:
# DOCKERHUB_USERNAME
# DOCKERHUB_TOKEN

      # Login to DockerHub
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker Image
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: weather-ml-app:latest

      # Push Docker Image
      - name: Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app-grp-4:latest
